name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# 本项目有意不使用 rustfmt：全仓按人工排版维护，跑 cargo fmt --check
# 会因存量差异直接变红。因此这里不设格式检查步骤，也不建议后人补上。
jobs:
  test:
    name: 测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 stable 工具链
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: 安装 OpenSSL 开发包
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: 缓存构建产物
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: 编译全部目标
        run: cargo build --locked --all-targets

      - name: 运行测试
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked 2>&1 | tee cargo-test.log

      # 失败时把用例名和 panic 首行写成注解，公开仓库无需日志权限也能
      # 在检查结果里看到哪条用例红了。
      - name: 标注失败用例
        if: failure()
        shell: bash
        run: |
          grep -E '^test .* \.\.\. FAILED$|^---- .* stdout ----|^thread .* panicked' cargo-test.log \
            | head -10 | sed 's/^/::error::/' || true

      # 需要真实 git 仓库的用例在默认测试里被标为 ignored：
      # 跑 CI 的机器上 git 在 PATH 中，这里把它们补上。
      - name: 运行依赖 git 的测试
        run: cargo test --locked -- --ignored

      # 基准 smoke：跑生产 CLI 的基准入口在空任务集上只发空 JSON 结果清单，
      # 不起模型、不连网络。它验证的是"基准装配与输出链路在三个平台都能跑通"，
      # **不是**真实模型的基准通过率（那个要接真实端点，另行单独跑，见
      # docs/roadmap.md 的 P14）。这里只保证发布产物里基准入口不崩。
      - name: 基准 smoke（空套件 JSON）
        run: cargo test --locked --test benchmark_output

  lint:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 stable 工具链
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: 安装 OpenSSL 开发包
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: 缓存构建产物
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # clippy 收紧为硬门禁：任何警告（含未使用、风格类）都会让 CI 变红。
      # 仓库已把存量提示清干净，这里不再留"可见但不阻断"的过渡状态。
      - name: clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked --all-targets --all-features -- -D warnings 2>&1 | tee clippy.log

      # 同测试任务：把 lint 的首行错误写成注解，便于无日志权限时定位。
      - name: 标注 clippy 问题
        if: failure()
        shell: bash
        run: |
          grep -E '^(error|warning)(\[|:)' clippy.log | head -10 | sed 's/^/::error::/' || true

      # 文档构建是 docs.rs 的预演：文档链断了会体现在这一步。
      - name: 构建文档
        run: cargo doc --locked --no-deps

  deps:
    name: 依赖约束
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 stable 工具链
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: 缓存依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      # 项目约束：TLS 走 native-tls，rustls 不得进入依赖树。
      # `cargo tree -i rustls` 在找不到时打印提示并以 0 退出，
      # 因此按输出文本判定。
      - name: rustls 不得进入依赖树
        run: |
          tree="$(cargo tree --locked --target all -i rustls 2>/dev/null || true)"
          if printf '%s' "$tree" | grep -qE '(^|[^a-z-])rustls v[0-9]'; then
            echo "::error::rustls 出现在依赖树里"
            printf '%s\n' "$tree"
            exit 1
          fi
          echo "rustls 未进入依赖树"
