# QCodeHarness 策略配置示例。
#
# 用法：复制为任意名字，然后设环境变量 QCH_POLICY 指向它：
#   PowerShell:  Copy-Item policy.example.toml my-policy.toml; $env:QCH_POLICY="my-policy.toml"
#
# 规则按数组顺序匹配，第一条命中的生效；都不命中走默认策略
# （只读工具放行、非只读工具要求审批）。想让某条 deny 优先，把它写在前面。

[[rules]]
tool = "read_file"
verdict = "allow"
description = "读文件无副作用，免审"

[[rules]]
tool = "list_dir"
verdict = "allow"
description = "列目录无副作用，免审"

[[rules]]
tool = "search_text"
verdict = "allow"
description = "文本搜索无副作用，免审"

[[rules]]
tool = "git_status"
verdict = "allow"
description = "git status 只读，免审"

[[rules]]
tool = "git_diff"
verdict = "allow"
description = "git diff 只读，免审"

[[rules]]
tool = "write_file"
verdict = "require_approval"
description = "整体覆盖文件不可逆，每次都要人确认"

[[rules]]
tool = "edit_file"
verdict = "require_approval"
description = "修改文件内容，每次都要人确认"

# run_command 的规则在下面的"参数级作用域"一节：cargo test 一族免审，
# 其余一律审批。写在这里会被那条宽规则挡住，见该节的顺序说明。

# ── 参数级作用域（P8-2）────────────────────────────────────────
# scope 让一条规则只匹配"工具名 + 参数"都命中的调用，而不是整个工具。
# 两个字段都可选，都不写等于没有作用域（退回只按工具名匹配）：
#
#   command_prefix  命令头，尾部 * 表示前缀匹配
#   path_prefix     路径前缀，尾部 * 表示前缀匹配
#
# 例子：cargo test 免审，但 run_command 其他子命令仍要审批。
#
# ⚠ 这条必须写在下面那条"run_command 一律审批"的前面。规则按数组顺序
# 匹配、第一条命中的生效：宽规则在前，后面补的窄 allow 永远撞不上它，
# 用户照抄会得到"cargo test 还是每次都要审"。想收窄某个子命令，
# 就把窄规则提前。

[[rules]]
tool = "run_command"
verdict = "allow"
description = "只读验证类命令免审"
scope = { command_prefix = "cargo test *" }

[[rules]]
tool = "run_command"
verdict = "require_approval"
description = "其余 shell 命令一律审批"

# ── 兜底说明（不要照抄）────────────────────────────────────────
# 可以再加一条不带 tool 字段的通配规则，把没列到的工具全部拒绝：
#
#   [[rules]]
#   verdict = "deny"
#   description = "未列入白名单的工具一律禁止"
#
# 但注意：这会把"以后新增的工具"也一并禁掉——模型每调一个新工具都会
# 被拒，直到你把它显式加进配置。本示例不启用它：默认策略
# （非只读要审批）已经是安全的兜底，deny 全禁适合 lockdown 场景。

# 语义（与 Claude Code 的 Bash(cmd:*) 对齐）：
#   "cargo test *" 匹配 "cargo test --nocapture"，也匹配 "cargo test"
#   "cargo test *" 不匹配 "cargo testx"     —— * 之前那段必须原样出现
#   "cargo build"  不匹配 "cargo build --release"（没有 * 就是精确相等）
#   "src/"         不匹配 "src/main.rs"      —— 要写 "src/*"
#
# * 不吞 shell 链接符：命令头之后一出现 && || ; | & 或换行，规则就不命中、
# 退回审批。"cargo test *" 因此不放行 "cargo test && rm -rf /"。
# 代价是 "cargo test 2>&1" 也要多问一次（单个 & 被算作链接符）——
# 刻意偏向多问：漏拦是把整条命令链交出去。
#
# 尾部匹配只在结尾：不支持 "git * main" 这种中间通配。
#
# scope 只收紧规则，不放松任何东西：写在这里的 allow 仍然要过
# 审批升级检查（见下）和受保护路径检查，三者是串联的。

# 只放行受信来源的推送，禁止强推：
#
# [[rules]]
# tool = "run_command"
# verdict = "allow"
# description = "只允许推送到 origin 的 main"
# scope = { command_prefix = "git push origin main" }
#
# [[rules]]
# tool = "run_command"
# verdict = "deny"
# description = "强推会改写远端历史，一律禁止"
# scope = { command_prefix = "git push --force *" }
