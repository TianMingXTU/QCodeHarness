id = "long-js-report-chain"
kind = "bug-fix"
description = "修复 long-js-report-chain 库：报表链的四个模块各带一个独立缺陷——loader.loadLines 丢了输入的最后一条行、cleaner.clean 只去了左边空白、transformer.toPercent 忘了把比例乘成百分数、ranker.rankScores 排序方向写反（要降序却给了升序），test/report.test.js 的四条测试全部失败。任务跨多个模块：读 src/ 下四个模块与 test/report.test.js，逐个定位根因，做最小修复，然后运行 node --test 验证全部测试通过。缺陷相互独立，修复一个不会让其他测试变绿。"
language = "javascript"
suite = "long"

[long_run]
# 第一次运行故意在第 4 轮耗尽预算：四个缺陷、四个工作流步骤，
# 4 轮必然停在修复中途。
exhaust_turns = 4
# 历史预算压小到必然触发裁剪：恢复段历史最长，压缩判据从这里核对。
context_max_tokens = 2000

[criteria]
test_command = "node --test"
requires_changes = true
answer_must_mention = []
# 长任务判据：至少 6 轮模型调用，防"恢复段偷懒跳步"。
min_turns = 6
# 全量测试允许在修复前后重复运行，不用于衡量副作用重放。
no_repeated_commands = []
# 压缩之后，模型仍要记得自己动过的模块名。
must_mention_after_compaction = ["cleaner"]
