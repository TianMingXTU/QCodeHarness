[package]
name = "QCodeHarness"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Rust 实现的 AI 编程执行框架：工具调用、权限审批、MCP 接入、跨平台沙箱与可审计证据"
license = "MIT"
repository = "https://github.com/TianMingXTU/QCodeHarness"
homepage = "https://github.com/TianMingXTU/QCodeHarness"
readme = "README.md"
keywords = ["ai-agent", "coding-agent", "llm", "mcp", "harness"]
categories = ["development-tools", "command-line-utilities"]

# 库目标：集成测试（tests/）与其他前端通过它复用全部逻辑，
# main.rs 只是薄壳。
[lib]
name = "qcode_harness"
path = "src/lib.rs"

[dependencies]
dotenvy = "0.15.7"
# 关闭默认的 rustls（会拉 aws-lc-rs，Windows 上需要 CMake/NASM），
# 改用 native-tls：Windows 上直接走系统 schannel。
# 依赖重命名为 rig，代码里用 `rig::` 引用；lib 本名是 rig_core。
rig = { package = "rig-core", version = "0.45.0", default-features = false, features = ["reqwest", "native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"
# 策略配置用 TOML：人写的配置文件要能带注释解释"为什么禁这个工具"，
# JSON 不支持注释，YAML 又多一个缩进地狱。toml 的表格数组正好表达规则列表。
toml = "0.8"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "time", "process", "io-util"] }
# MCP（Model Context Protocol）官方 Rust SDK：经它接入外部工具。
# 只选 client + stdio 子进程传输 + 通用 async-rw 传输，明确关掉默认
# features——默认集会拉 reqwest/SSE 一族，进而引入 rustls（Windows 上
# 需要 CMake/NASM，见上面 rig 的注释）。这三个 feature 不碰 HTTP/TLS，
# `cargo tree -i rustls` 为空是对该选择的验收项。
rmcp = { version = "3.8.0", default-features = false, features = ["client", "transport-child-process", "transport-async-rw"] }
ignore = "0.4.34"
regex = "1.13.1"

# Windows Job Object：进程树的资源限制与整树终止（沙箱）。
# 只挑 Win32 的三个子 feature（句柄基础 + Job Objects + 进程/线程），
# 不碰任何网络/TLS feature；windows crate 不引 rustls，
# `cargo tree -i rustls` 为空仍是验收项。只在 Windows 目标下生效，
# 非 Windows 平台不拉这个依赖（cfg 分发见 infrastructure/sandbox）。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
# 测试需要 rig 的 test-utils 提供 MockCompletionModel，
# 用假的模型响应驱动 AgentRunner，避免真实网络调用。
# 注意：这里必须重新声明 rig 而不能追加到上面的 feature 列表，
# 否则 test-utils 会进入正式产物。
rig = { package = "rig-core", version = "0.45.0", default-features = false, features = ["reqwest", "native-tls", "test-utils"] }
# 进程内协议测试要用 rmcp 的 server 栈起一个测试 Server（内存 duplex，不碰
# 网络）；examples/mcp-echo-server.rs 演示 Server 的 stdio 传输也要
# transport-io（只是 tokio 的 io-std/net，无 HTTP/TLS）。这两个 feature 只在
# 测试构建生效，release 产物的 rmcp feature 集不变。
rmcp = { version = "3.8.0", features = ["server", "transport-io"] }
