[package]
name = "QCodeHarness"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

# 库目标：集成测试（tests/）与其他前端通过它复用全部逻辑，
# main.rs 只是薄壳。
[lib]
name = "qcode_harness"
path = "src/lib.rs"

[dependencies]
dotenvy = "0.15.7"
# 关闭默认的 rustls（会拉 aws-lc-rs，Windows 上需要 CMake/NASM），
# 改用 native-tls：Windows 上直接走系统 schannel。
# 依赖重命名为 rig，代码里用 `rig::` 引用；lib 本名是 rig_core。
rig = { package = "rig-core", version = "0.45.0", default-features = false, features = ["reqwest", "native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"
# 策略配置用 TOML：人写的配置文件要能带注释解释"为什么禁这个工具"，
# JSON 不支持注释，YAML 又多一个缩进地狱。toml 的表格数组正好表达规则列表。
toml = "0.8"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "time", "process"] }

[dev-dependencies]
# 测试需要 rig 的 test-utils 提供 MockCompletionModel，
# 用假的模型响应驱动 AgentRunner，避免真实网络调用。
# 注意：这里必须重新声明 rig 而不能追加到上面的 feature 列表，
# 否则 test-utils 会进入正式产物。
rig = { package = "rig-core", version = "0.45.0", default-features = false, features = ["reqwest", "native-tls", "test-utils"] }
